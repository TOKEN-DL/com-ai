name: CI

# 每次 push 与 PR 都跑 lint + typecheck + test，全绿才算通过。
# 这是项目里第一个 CI —— 在它之前，五个相关仓库都没有「改坏了能不能立刻知道」的护栏。
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + typecheck + test
    runs-on: ubuntu-latest

    services:
      # 测试 harness 用它建 / 删每次运行唯一的 test_<random> 库。
      # 必须是真实 Postgres：全文检索与 trigram 的行为只有在真实 PG 上才作数。
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: comai
          POSTGRES_PASSWORD: comai_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comai -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # harness 的管理连接串：连上去建 / 删每轮独立的测试数据库。
      TEST_DATABASE_ADMIN_URL: postgresql://comai:comai_test_password@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      # 版本取自 package.json 的 packageManager 字段（pnpm@10.21.0）。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate docker compose file
        run: docker compose config --quiet
